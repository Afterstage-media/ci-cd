map $http_x_forwarded_proto $client_protocol {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name afterstage.ar www.afterstage.ar;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 210m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  if ($client_protocol = "http") { return 301 https://$host$request_uri; }

  location /api/ { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
  location = /mcp { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Authorization $http_authorization; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 120s; }
  location = /authorize { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
  location = /token { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
  location = /register { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /oauth/login { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
  location = /oauth/approve { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
  location = /.well-known/oauth-authorization-server { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location = /.well-known/oauth-protected-resource/mcp { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /media/ { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; }
  location = /health { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; }
  location = /ready { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; }
  location ^~ /notas/ { proxy_pass http://backend:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $client_protocol; proxy_read_timeout 120s; }
  location = /press-kit { proxy_pass http://backend:8787; proxy_set_header Host $host; }
  location = /rss.xml { proxy_pass http://backend:8787; proxy_set_header Host $host; }
  location = /sitemap.xml { proxy_pass http://backend:8787; proxy_set_header Host $host; }
  location = /robots.txt { proxy_pass http://backend:8787; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
