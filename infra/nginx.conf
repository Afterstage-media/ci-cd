server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 210m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location /api/ { proxy_pass http://social-manager:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120s; }
  location /media/ { proxy_pass http://social-manager:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /press-kit { proxy_pass http://social-manager:8787; proxy_set_header Host $host; }
  location = /rss.xml { proxy_pass http://social-manager:8787; proxy_set_header Host $host; }
  location = /sitemap.xml { proxy_pass http://social-manager:8787; proxy_set_header Host $host; }
  location = /robots.txt { proxy_pass http://social-manager:8787; proxy_set_header Host $host; }
  location / { try_files $uri $uri/ /index.html; }
}
