name: Reusable container publishing

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: medio-under/ci-cd
          path: ci-cd
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish frontend image
        if: inputs.component == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ci-cd/infra/frontend.Dockerfile
          push: true
          tags: |
            ghcr.io/medio-under/frontend:main-${{ github.run_number }}
            ghcr.io/medio-under/frontend:latest
            ghcr.io/medio-under/frontend:${{ github.ref_name }}
      - name: Publish backend image
        if: inputs.component == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/medio-under/backend:main-${{ github.run_number }}
            ghcr.io/medio-under/backend:latest
            ghcr.io/medio-under/backend:${{ github.ref_name }}
