apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Afterstage k3d cluster on underkode is isolated from Orux's native k3s.
namespace: afterstage

resources:
  - ../k3s
  - cloudflared.yaml

patches:
  - target:
      group: ""
      version: v1
      kind: Namespace
      name: afterstage
    patch: |-
      - op: replace
        path: /metadata/name
        value: afterstage
  - target:
      group: ""
      version: v1
      kind: ConfigMap
      name: afterstage-config
    patch: |-
      - op: replace
        path: /data/MONGODB_DB
        value: medio_under
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: website
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
images:
  - name: backend
    newName: ghcr.io/afterstage-media/backend
    newTag: main-281
  - name: frontend
    newName: ghcr.io/afterstage-media/frontend
    newTag: main-281
