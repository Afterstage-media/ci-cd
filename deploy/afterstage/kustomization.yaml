apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The Afterstage k3d cluster on underkode is isolated from Orux's native k3s.
namespace: afterstage

resources:
  - ../k3s
  - cloudflared.yaml
  - mongodb.yaml

patches:
  - target:
      group: ""
      version: v1
      kind: Namespace
      name: afterstage
    patch: |-
      - op: replace
        path: /metadata/name
        value: afterstage

images:
  - name: backend
    newName: ghcr.io/afterstage/backend
    newTag: latest
  - name: frontend
    newName: ghcr.io/afterstage/frontend
    newTag: latest
