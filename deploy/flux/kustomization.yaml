apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: afterstage
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 3m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: afterstage
  path: ./deploy/k3s/overlays/production
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: backend
      namespace: afterstage
    - apiVersion: apps/v1
      kind: Deployment
      name: website
      namespace: afterstage
