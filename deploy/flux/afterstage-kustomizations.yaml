apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: afterstage-namespace
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: afterstage
  path: ./deploy/afterstage-namespace
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: afterstage-secrets
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  wait: true
  prune: true
  dependsOn:
    - name: afterstage-namespace
  sourceRef:
    kind: GitRepository
    name: afterstage-secrets
  path: ./projects/afterstage/prod
  decryption:
    provider: sops
    secretRef:
      name: afterstage-sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: afterstage
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 5m
  wait: true
  prune: true
  dependsOn:
    - name: afterstage-secrets
  sourceRef:
    kind: GitRepository
    name: afterstage
  path: ./deploy/afterstage
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: backend
      namespace: afterstage
    - apiVersion: apps/v1
      kind: Deployment
      name: cloudflared
      namespace: afterstage
    - apiVersion: apps/v1
      kind: Deployment
      name: afterstage-cloudflared
      namespace: afterstage
    - apiVersion: apps/v1
      kind: Deployment
      name: website
      namespace: afterstage
