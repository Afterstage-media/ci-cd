apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: afterstage
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/Afterstage-media/ci-cd.git
  ref:
    branch: main
  timeout: 60s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: afterstage-flux
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  # The root reconciles Flux resources, including the application Kustomization.
  # It must not block on application health or it cannot propagate a recovery
  # when a workload is temporarily unhealthy.
  wait: false
  prune: true
  sourceRef:
    kind: GitRepository
    name: afterstage
  path: ./deploy/flux
