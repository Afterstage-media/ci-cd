apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: medio-under
  labels: {app: cloudflared}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cloudflared}
  template:
    metadata:
      labels: {app: cloudflared}
    spec:
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2025.9.1
          args: [tunnel, --no-autoupdate, run, --token, "$(TUNNEL_TOKEN)"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef: {name: medio-under-secrets, key: CLOUDFLARE_TUNNEL_TOKEN}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
