apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-manager
  namespace: medio-under
  labels: {app: social-manager}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: social-manager}
  template:
    metadata:
      labels: {app: social-manager}
    spec:
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: social-manager
          image: backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8787}]
          envFrom:
            - configMapRef: {name: medio-under-config}
            - secretRef: {name: medio-under-secrets}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: media, mountPath: /app/uploads}
            - {name: media, mountPath: /app/media}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 1000m, memory: 768Mi}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: medio-under-data}}
        - {name: media, persistentVolumeClaim: {claimName: medio-under-media}}
---
apiVersion: v1
kind: Service
metadata:
  name: social-manager
  namespace: medio-under
spec:
  selector: {app: social-manager}
  ports: [{name: http, port: 8787, targetPort: http}]
