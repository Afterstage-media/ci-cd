apiVersion: v1
kind: ConfigMap
metadata:
  name: afterstage-config
  namespace: afterstage
data:
  NODE_ENV: production
  PORT: "8787"
  DATA_DIR: /app/data
  UPLOAD_DIR: /app/uploads
  MEDIA_ROOT: /app/media
  MONGODB_DB: afterstage
  PUBLIC_BASE_URL: https://afterstage.ar
  MCP_PUBLIC_URL: https://afterstage.ar
  PUBLIC_MEDIA_BASE_URL: https://afterstage.ar
  CLOUDFLARE_TUNNEL_URL: https://afterstage.ar
  CORS_ORIGINS: https://afterstage.ar
  PUBLIC_INCLUDE_DEMO_DATA: "false"
  META_API_VERSION: v24.0
  SCHEDULER_INTERVAL_MS: "30000"
  RATE_LIMIT: "120"
  TRUST_PROXY: "true"
  PRESS_AUTO_FOLLOWUP: "false"
  MCP_ALLOW_LIVE_PUBLISH: "false"
  MCP_ALLOW_LIVE_EMAIL: "false"
