apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-quick
  namespace: afterstage
  labels: {app: cloudflared-quick}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cloudflared-quick}
  template:
    metadata:
      labels: {app: cloudflared-quick}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cloudflared
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          image: cloudflare/cloudflared:2025.9.1
          args: [tunnel, --no-autoupdate, --protocol, http2, --url, http://website:80]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
