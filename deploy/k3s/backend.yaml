apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: medio-under
  labels: {app: backend}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          image: backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8787}]
          envFrom:
            - configMapRef: {name: medio-under-config}
            - secretRef: {name: medio-under-secrets}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: media, mountPath: /app/uploads}
            - {name: media, mountPath: /app/media}
            - {name: x509, mountPath: /etc/medio-under/x509.pem, subPath: x509.pem, readOnly: true}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 1000m, memory: 768Mi}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: medio-under-data}}
        - {name: media, persistentVolumeClaim: {claimName: medio-under-media}}
        - {name: x509, secret: {secretName: medio-under-x509, optional: false}}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: medio-under
spec:
  selector: {app: backend}
  ports: [{name: http, port: 8787, targetPort: http}]
