apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: afterstage
  labels: {app: backend}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          image: backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8787}]
          envFrom:
            - configMapRef: {name: afterstage-config}
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: JWT_SECRET}
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: MONGODB_URI}
            - name: INBOUND_EMAIL_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: INBOUND_EMAIL_WEBHOOK_SECRET, optional: true}
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: AI_API_KEY, optional: true}
            - name: META_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: META_ACCESS_TOKEN, optional: true}
            - name: META_INSTAGRAM_ACCOUNT_ID
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: META_INSTAGRAM_ACCOUNT_ID, optional: true}
            - name: META_INSTAGRAM_APP_SECRET
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: META_INSTAGRAM_APP_SECRET, optional: true}
            - name: META_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: META_TOKEN_ENCRYPTION_KEY, optional: true}
            - name: META_PAGE_ID
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: META_PAGE_ID, optional: true}
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: SMTP_HOST, optional: true}
            - name: SMTP_USER
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: SMTP_USER, optional: true}
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: SMTP_PASS, optional: true}
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: SMTP_FROM, optional: true}
            - name: MEDIA_GATEWAY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: afterstage-secrets, key: MEDIA_GATEWAY_SERVICE_TOKEN, optional: true}
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: media, mountPath: /app/uploads}
            - {name: media, mountPath: /app/media}
            - {name: x509, mountPath: /etc/afterstage/x509.pem, subPath: x509.pem, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 1000m, memory: 768Mi}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: afterstage-data}}
        - {name: media, persistentVolumeClaim: {claimName: afterstage-media}}
        - {name: x509, secret: {secretName: afterstage-x509, optional: false}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: afterstage
spec:
  selector: {app: backend}
  ports: [{name: http, port: 8787, targetPort: http}]
