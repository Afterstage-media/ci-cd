apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medio-under-data
  namespace: medio-under
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: medio-under-media
  namespace: medio-under
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
