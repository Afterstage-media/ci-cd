apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: afterstage-data
  namespace: afterstage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: afterstage-media
  namespace: afterstage
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
