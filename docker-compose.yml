services:
  mongo:
    image: mongo:7.0
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    image: ghcr.io/medio-under/backend:latest
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend.env
        required: false
    environment:
      PORT: 8787
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      MEDIA_ROOT: /app/media
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/medio_under}
      MONGODB_DB: ${MONGODB_DB:-medio_under}
      MEDIA_GATEWAY_URL: ${MEDIA_GATEWAY_URL:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_MAX_OBJECT_BYTES: ${MEDIA_MAX_OBJECT_BYTES:-5242880}
      MEDIA_MAX_TOTAL_BYTES: ${MEDIA_MAX_TOTAL_BYTES:-26843545600}
      MEDIA_MAX_MONTHLY_UPLOAD_BYTES: ${MEDIA_MAX_MONTHLY_UPLOAD_BYTES:-2147483648}
      MEDIA_RESERVATION_TTL_MS: ${MEDIA_RESERVATION_TTL_MS:-86400000}
      MEDIA_ORPHAN_GRACE_MS: ${MEDIA_ORPHAN_GRACE_MS:-172800000}
      MEDIA_MAINTENANCE_INTERVAL_MS: ${MEDIA_MAINTENANCE_INTERVAL_MS:-604800000}
      TRUST_PROXY: "true"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_media:/app/media
    restart: unless-stopped

  frontend:
    image: ghcr.io/medio-under/frontend:latest
    build:
      context: ..
      dockerfile: ci-cd/infra/local-frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  cloudflared-quick:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["quick-tunnel"]
    depends_on:
      frontend:
        condition: service_started
    command: tunnel --no-autoupdate --url http://frontend:80
    restart: unless-stopped

  cloudflared-named:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["named-tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  mongo_data:
  backend_data:
  backend_uploads:
  backend_media:
