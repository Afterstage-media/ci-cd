services:
  backend:
    image: ghcr.io/medio-under/backend:latest
    env_file:
      - path: ./backend.env
        required: false
    environment:
      PORT: 8787
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
      MEDIA_ROOT: /app/media
      MONGODB_DB: ${MONGODB_DB:-medio_under}
      TRUST_PROXY: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - backend_media:/app/media
    restart: unless-stopped

  frontend:
    image: ghcr.io/medio-under/frontend:latest
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  cloudflared-quick:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["quick-tunnel"]
    depends_on:
      frontend:
        condition: service_started
    command: tunnel --no-autoupdate --url http://frontend:80
    restart: unless-stopped

  cloudflared-named:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["named-tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped

volumes:
  backend_data:
  backend_uploads:
  backend_media:
